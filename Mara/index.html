ettings summary{font-weight:700;font-size:1.1rem;cursor:pointer}.settings[open] summary{margin-bottom:12px}.monster-choices{display:grid;grid-template-columns:repeat(5,minmax(64px,1fr));gap:8px;margin:12px 0}.monster-pick{border:2px solid transparent;border-radius:12px;background:#f4f5f0;padding:6px;min-width:0}.monster-pick[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px #2b59c333}.monster-pick img{display:block;width:100%;max-width:72px;aspect-ratio:1;margin:auto;border-radius:12px}.flash{max-width:700px;min-height:320px;padding:30px}.flash .side{font-size:1.5rem;min-height:125px;display:grid;place-items:center}.card-actions .btn{min-height:34px;padding:5px 10px;font-size:.84rem}.btn.reveal{background:#dceeff;border-color:#8bbde7;color:#183a59}@media(max-width:580px){.monster-choices{grid-template-columns:repeat(5,minmax(48px,1fr));gap:4px}.flash{min-height:300px;padding:20px}}.topic h3{overflow-wrap:anywhere}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.spread{justify-content:space-between}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.btn{background:var(--paper);border:2px solid var(--ink);border-radius:11px;color:var(--ink);padding:9px 14px;min-height:44px;font-weight:700}.btn.primary{background:var(--accent);border-color:var(--accent);color:white}.btn.danger{border-color:var(--red);color:var(--red)}.btn.active{background:var(--ink);color:white}.field{display:grid;gap:5px;margin:10px 0}.field input,.field textarea,input,textarea{width:100%;border:1px solid #899893;border-radius:9px;padding:10px 12px;background:white;color:#172325}.field textarea{resize:vertical}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.info-list{display:grid;gap:10px;margin-top:12px}.info{white-space:pre-wrap;overflow-wrap:anywhere}.content-image{display:block;max-width:min(100%,420px);max-height:300px;object-fit:contain;border-radius:12px;border:1px solid var(--line);margin:12px auto}.inline-illustration{border:0;object-fit:contain;color:#2b59c3}.image-field{display:grid;gap:5px;margin:10px 0}.image-field input{max-width:100%}.image-preview{max-width:130px;max-height:90px;object-fit:contain;vertical-align:middle;border-radius:8px}.empty{border:1px dashed var(--line);border-radius:12px;padding:16px;color:var(--muted)}.flash{max-width:600px;min-height:230px;display:grid;align-content:center;gap:16px;margin:16px auto;text-align:center}.flash .side{font-size:1.25rem;white-space:pre-wrap;overflow-wrap:anywhere}.quizbox{max-width:700px;margin:18px auto;display:grid;gap:16px}.quiz-stats{display:flex;align-items:center;gap:16px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 18px}.pie{width:82px;height:82px;border-radius:50%;background:conic-gradient(from -90deg,#267345 0 var(--k),#bd5148 var(--k) calc(var(--k) + var(--m)),#e5ebe4 calc(var(--k) + var(--m)) 100%);display:grid;place-items:center;flex:none}.pie:after{content:"";width:48px;height:48px;border-radius:50%;background:var(--paper)}.idea-panel{background:linear-gradient(135deg,#edf3ff,#fff);border-left:6px solid var(--accent);padding:20px 22px}.idea-kicker,.summary-kicker{font-size:.82rem;text-transform:uppercase;letter-spacing:.1em;font-weight:800;color:var(--accent);margin-bottom:7px}.overview-text{white-space:pre-wrap;line-height:1.55}.braindump-section{margin:22px 0}.braindump-section>h2{margin-bottom:5px}.braindump-hint{margin:0 0 12px}.card-editor>summary{font-weight:800;font-size:1.1rem;cursor:pointer}.card-editor[open]>summary{margin-bottom:12px}.card-overview{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:12px}.overview-card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 2px 0 #1b262c12}.overview-card-head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px}.overview-faces{display:block}.overview-face{border-radius:12px;background:#f5f7f3;padding:16px;min-height:140px;overflow-wrap:anywhere;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:1.15rem;line-height:1.5;white-space:pre-wrap}.overview-card[data-dump-card]{cursor:pointer;transition:transform .16s ease,box-shadow .16s ease}.overview-card[data-dump-card]:hover{transform:translateY(-2px);box-shadow:0 5px 14px #1b262c18}.overview-card[data-dump-card]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}.overview-image{max-width:100%;max-height:90px;object-fit:contain;display:block;margin:6px auto}.overview-arrow{font-size:1.3rem;color:var(--accent);padding-top:24px}.summary-panel{background:linear-gradient(135deg,#fff7df,#fff);border-top:4px solid #e3a71a}.info-text{white-space:pre-wrap;line-height:1.55}#homeDataControls .btn{min-height:30px;padding:4px 8px;font-size:.82rem;background:#eceff0;border:1px solid #c8ced0;color:#344047;border-radius:8px}#titleEditBtn,#topicSave,#toggleTopicEdit{min-height:30px;padding:4px 8px;font-size:.82rem;background:#eceff0;border:1px solid #c8ced0;color:#344047;border-radius:8px}.trash-btn{width:34px;height:34px;min-width:34px;display:inline-grid;place-items:center;padding:5px;border:1px solid #cbd0d2;border-radius:9px;background:#f0f2f3;color:#59646a;cursor:pointer}.trash-btn:hover{background:#e2e6e8;color:#29343a}.trash-btn svg{width:18px;height:18px;display:block}.topic{position:relative;padding-bottom:56px}.topic .trash-btn{position:absolute;top:auto;right:10px;bottom:10px}.info-list .row{justify-content:space-between}.flash .card-actions{justify-content:flex-end!important}.stats-text{display:grid;gap:2px}.vocab-progress{margin:12px 0}.vocab-progress .pie{background:conic-gradient(from -90deg,#267345 0 var(--k),#bd5148 var(--k) calc(var(--k) + var(--m)),#e5ebe4 calc(var(--k) + var(--m)) 100%)}.vocab-progress .pie:after{background:var(--paper)}.stats-text strong{font-size:1.1rem}.stats-legend{font-size:.9rem;color:var(--muted)}.superbrain{font-size:1.35rem;font-weight:800;color:#2b59c3;margin:6px 0}.award{width:88px;height:88px;margin:8px auto 2px;display:grid;place-items:center}.award svg{width:100%;height:100%;filter:drop-shadow(0 3px 2px #9a6e2a44)}.center{text-align:center}.hidden{display:none!important}#homeDataControls[hidden]{display:none!important}.status{min-height:24px;color:var(--green)}footer{margin-top:30px;padding-top:14px;border-top:1px solid var(--line)}@media(max-width:580px){.formrow{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}.wrap{width:min(100% - 20px,920px)}}
</style></head><body><div class="wrap"><header><div><h1 id="pageTitle">Robins Lernkarten</h1><div class="muted">Eigene Themen, Infos und Karten zum Lernen</div></div><div class="row"><button class="btn" id="titleEditBtn">Titel ändern</button><button class="btn" id="homeBtn" hidden>Alle Themen</button></div></header><main id="app"></main><footer class="row"><div id="homeDataControls" class="row"><button class="btn" id="backupOut">Daten speichern</button><button class="btn" id="backupIn">Sicherung laden</button><button class="btn" id="topicIn">Thema laden</button><button class="btn" id="vocabIn" hidden>Vokabelsammlung laden</button></div><input id="backupFile" type="file" accept="application/json" hidden><input id="topicFile" type="file" accept="application/json" hidden><input id="vocabFile" type="file" accept="application/json" hidden><span class="muted small">Die Inhalte werden in diesem Browser gespeichert. Möchtest Du sie dauerhaft speichern, nutze den Button „Daten speichern“.</span></footer></div>
<script>
(function(){'use strict';const KEY='robin-hsu-themen-v2';const VKEY='robin-hsu-vocabulary-v1';const SOURCE_ICONS={"ackerbau":"<path d=\"M32 60V14\"/><path d=\"M32 22C27 17 27 10 32 5C37 10 37 17 32 22Z\"/><path d=\"M32 30C25 30 21 26 21 19C28 19 32 24 32 30Z\"/><path d=\"M32 30C39 30 43 26 43 19C36 19 32 24 32 30Z\"/><path d=\"M32 42C25 42 21 38 21 31C28 31 32 36 32 42Z\"/><path d=\"M32 42C39 42 43 38 43 31C36 31 32 36 32 42Z\"/><path d=\"M32 54C25 54 21 50 21 43C28 43 32 48 32 54Z\"/><path d=\"M32 54C39 54 43 50 43 43C36 43 32 48 32 54Z\"/>","hausbau":"<path d=\"M6 34L32 12L58 34\"/><path d=\"M12 30V54H52V30\"/><path d=\"M27 54V40H37V54\"/><path d=\"M12 43H27M37 43H52\"/>","toepferei":"<path d=\"M19 16H45\"/><path d=\"M21 16C21 22 15 26 14 36C13 48 22 56 32 56C42 56 51 48 50 36C49 26 43 22 43 16\"/><path d=\"M16 37L21 42L26 37L31 42L36 37L41 42L46 37L49 40\"/>","tierzucht":"<path d=\"M23 21Q12 22 9 11\"/><path d=\"M41 21Q52 22 55 11\"/><path d=\"M22 26L11 28\"/><path d=\"M42 26L53 28\"/><path d=\"M22 22Q32 18 42 22L44 40Q44 53 32 53Q20 53 20 40Z\"/><path d=\"M25 46Q32 51 39 46\"/><circle cx=\"26\" cy=\"32\" r=\"1.8\" fill=\"currentColor\"/><circle cx=\"38\" cy=\"32\" r=\"1.8\" fill=\"currentColor\"/><circle cx=\"29\" cy=\"45\" r=\"1.2\" fill=\"currentColor\"/><circle cx=\"35\" cy=\"45\" r=\"1.2\" fill=\"currentColor\"/>","hakenpflug":"<path d=\"M8 16C22 18 34 32 44 50\"/><path d=\"M44 50C47 36 49 22 53 10\"/><path d=\"M44 50L50 57\"/><path d=\"M4 57H60\"/><path d=\"M10 62H20M26 62H38M44 62H54\"/>","steinbohrung":"<path d=\"M28 16L54 20L56 32L36 34C32 30 28 22 28 16Z\"/><circle cx=\"42\" cy=\"26\" r=\"3\"/><path d=\"M10 58L42 26\"/><path d=\"M42 26L46 22\"/>","muehle":"<path d=\"M6 46C6 40 20 38 32 38C46 38 58 40 58 46C58 54 46 56 32 56C18 56 6 54 6 46Z\"/><path d=\"M20 36C20 28 28 24 36 26C44 28 46 34 42 38C34 40 24 40 20 36Z\"/><circle cx=\"9\" cy=\"30\" r=\"1.6\" fill=\"currentColor\"/><circle cx=\"15\" cy=\"24\" r=\"1.6\" fill=\"currentColor\"/><circle cx=\"8\" cy=\"22\" r=\"1.6\" fill=\"currentColor\"/><circle cx=\"50\" cy=\"32\" r=\"1.6\" fill=\"currentColor\"/><circle cx=\"55\" cy=\"27\" r=\"1.6\" fill=\"currentColor\"/>","spinnen":"<path d=\"M20 16C16 10 24 6 28 9C31 4 39 5 40 10C46 9 48 16 43 19C41 24 33 24 31 21C26 24 19 21 20 16Z\"/><path d=\"M32 22V60\"/><path d=\"M22 47C22 41 42 41 42 47C42 53 22 53 22 47Z\"/><path d=\"M32 26C38 30 26 34 32 38\"/>","webstuhl":"<path d=\"M8 10H56\"/><path d=\"M8 54H56\"/><path d=\"M14 6V58\"/><path d=\"M50 6V58\"/><path d=\"M21 10V54M28 10V54M35 10V54M42 10V54\"/><path d=\"M18 36H45M18 41H45M18 46H45\"/>"};const app=document.getElementById('app');let appTitle=localStorage.getItem('robin-hsu-app-title-v1')||'Robins Lernkarten';document.title=appTitle;document.getElementById('pageTitle').textContent=appTitle;let topics=load(),current=null,tab='info',cardIndex=0,showAnswer=false,quiz=null,topicEditMode=false,editingNoteIndex=null,editingCardIndex=null,vocabularyLists=loadVocab(),homeMode='topics',activeVocabId=null,vocabTab='words',vocabStudy=null,vocabQuiz=null;const COLORS=['#f7d9c5','#dce9fa','#e6dbf5','#d9eee2','#fae9ad','#f6d9e3'];topics.forEach((t,i)=>{if(!t.color)t.color=COLORS[i%COLORS.length];if(!t.textColor)t.textColor='#1e2b2c';if(t.monster===undefined)t.monster=i%10;if(!t.image)t.image=art(t.monster)});
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return Array.isArray(x)?x:[]}catch(e){return []}}
function save(){localStorage.setItem(KEY,JSON.stringify(topics))}function loadVocab(){try{const x=JSON.parse(localStorage.getItem(VKEY));return Array.isArray(x)?x:[]}catch(e){return []}}function saveVocab(){localStorage.setItem(VKEY,JSON.stringify(vocabularyLists))}function art(i){const colors=['#68c8a5','#f39a6c','#9e8de3','#f2c84b','#62afd6','#eb79a7','#8acb64','#ee846e','#7eacd9','#c18ad3'];const toppings=['<path d="M28 27 18 8l21 12M72 27 82 8 61 20"/>','<path d="M28 24 31 7l12 15M72 24 69 7 57 22"/>','<path d="M25 28 12 17l20 2M75 28l13-11-20 2"/>','<path d="M34 22 25 5l18 14M66 22 75 5 57 19"/>','<path d="M24 30Q9 8 34 20M76 30Q91 8 66 20"/>','<path d="M30 23 25 7l17 15M70 23 75 7 58 22"/>','<path d="M28 24V8M42 20V4M58 20V4M72 24V8"/>','<path d="M25 24Q18 5 38 17M75 24Q82 5 62 17"/>','<path d="M28 24 19 9l20 12M72 24 81 9 61 21"/>','<path d="M30 20 35 5l10 15M70 20 65 5 55 15"/>'];const i2=((Number(i)||0)%10+10)%10;const svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="24" fill="#fff4d5"/><path d="M50 17C25 17 17 36 20 60 23 81 37 89 50 89s27-8 30-29c3-24-5-43-30-43Z" fill="'+colors[i2]+'" stroke="#253238" stroke-width="4"/>'+toppings[i2]+'<ellipse cx="38" cy="41" rx="7" ry="9" fill="white" stroke="#253238" stroke-width="3"/><ellipse cx="62" cy="41" rx="7" ry="9" fill="white" stroke="#253238" stroke-width="3"/><circle cx="39" cy="43" r="3"/><circle cx="61" cy="43" r="3"/><path d="M40 58Q50 '+(i2%2?69:67)+' 60 58" fill="none" stroke="#253238" stroke-width="4" stroke-linecap="round"/><circle cx="22" cy="59" r="5" fill="#f28b6c"/><circle cx="78" cy="59" r="5" fill="#f28b6c"/></svg>';return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function id(){return 't'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function topic(){return topics.find(t=>t.id===current)}function btn(text,attrs=''){return '<button class="btn" '+attrs+'>'+text+'</button>'}function trashButton(attrs=''){return '<button type="button" class="trash-btn" '+attrs+' aria-label="Löschen" title="Löschen"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2m3 0-1 14H6L5 6m4 4v7m6-7v7"/></svg></button>'}

function topicsHome(){current=null;document.getElementById('vocabIn').hidden=true;document.getElementById('topicIn').hidden=false;document.getElementById('homeDataControls').hidden=false;document.getElementById('titleEditBtn').hidden=false;document.getElementById('homeBtn').hidden=true;document.body.style.backgroundColor='var(--bg)';app.innerHTML='<nav class="tabs" aria-label="Startseite"><button class="btn '+(homeMode==='topics'?'active':'')+'" data-home-mode="topics">Themen</button><button class="btn '+(homeMode==='vocab'?'active':'')+'" data-home-mode="vocab">Vokabelsammlungen</button></nav><section class="panel"><h2 style="margin-top:0">Deine Themen</h2><p class="muted">Lege für jedes Schulthema eine eigene Lernseite an.</p><form id="newTopic" class="row"><input id="topicName" aria-label="Themenname" placeholder="Neues Thema, zum Beispiel: Pflanzen" maxlength="80" required><label class="color-field">Hintergrund <input id="newColor" type="color" value="#dce9fa" aria-label="Themenfarbe"></label><label class="color-field">Textfarbe <input id="newTextColor" type="color" value="#1e2b2c" aria-label="Textfarbe"></label><button class="btn primary">Thema erstellen</button></form></section><div class="topics">'+(topics.map(t=>'<article class="topic" style="background:'+esc(t.color)+';color:'+esc(t.textColor)+'"><div class="topic-head"><img class="topic-art" src="'+esc(t.image)+'" alt="Comicbild für '+esc(t.name)+'"><div><h3>'+esc(t.name)+'</h3><div class="muted small">'+t.notes.length+' Infos · '+t.cards.length+' Karteikarten</div></div></div><div class="row">'+btn('Thema öffnen','data-open="'+esc(t.id)+'"')+trashButton('data-delete-topic="'+esc(t.id)+'"')+'</div></article>').join('')||'<p class="empty">Noch gibt es keine Themen. Erstelle oben dein erstes Thema.</p>')+'</div>';app.querySelector('#newTopic').addEventListener('submit',e=>{e.preventDefault();const name=app.querySelector('#topicName').value.trim();if(!name)return;const t={id:id(),name,color:app.querySelector('#newColor').value,textColor:app.querySelector('#newTextColor').value,monster:topics.length%10,image:art(topics.length%10),notes:[],cards:[]};topics.push(t);save();open(t.id,true)});app.querySelectorAll('[data-home-mode]').forEach(b=>b.onclick=()=>{homeMode=b.dataset.homeMode;home()});app.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>open(b.dataset.open));app.querySelectorAll('[data-delete-topic]').forEach(b=>b.onclick=()=>{const t=topics.find(x=>x.id===b.dataset.deleteTopic);if(t&&confirm('Thema „'+t.name+'“ mit allen Infos und Karten löschen?')){topics=topics.filter(x=>x.id!==t.id);save();home()}})}
function parseVocab(text){const words=[],seen=new Set();let bad=0;String(text||'').split(/\r?\n/).forEach(line=>{line=line.trim();if(!line)return;let parts=line.split(/\s*(?:=|\t|;)\s*/);if(parts.length<2){const m=line.match(/^(.+?)\s+[-–—:]\s+(.+)$/);if(m)parts=[m[1],m[2]]}const latin=(parts[0]||'').trim(),german=(parts[1]||'').trim();let emoji=(parts[2]||'').trim();if(!latin||!german||latin.length>40||german.length>80){bad++;return}if(emoji.length>8)emoji='';const k=latin.toLocaleLowerCase();if(seen.has(k))return;seen.add(k);words.push([latin,german,emoji])});return{words:words.slice(0,150),bad}}
function vocabularyHome(){document.getElementById('vocabIn').hidden=false;document.getElementById('topicIn').hidden=true;app.innerHTML='<nav class="tabs" aria-label="Startseite"><button class="btn" data-home-mode="topics">Themen</button><button class="btn active" data-home-mode="vocab">Vokabelsammlungen</button></nav><section class="panel"><h2 style="margin-top:0">Vokabelsammlungen</h2><p class="muted">Lege getrennte Wortlisten an, zum Beispiel für verschiedene Lektionen.</p><form id="newVocab" class="row"><input id="vocabName" aria-label="Name der Vokabelsammlung" placeholder="Name der Sammlung, z. B. Lektion 1" maxlength="80" required><button class="btn primary">Sammlung erstellen</button></form></section><div class="topics">'+(vocabularyLists.map(v=>'<article class="topic"><div><h3>'+esc(v.name)+'</h3><div class="muted small">'+v.words.length+' Vokabeln</div></div><div class="row">'+btn('Sammlung öffnen','data-vocab-open="'+esc(v.id)+'"')+btn('Daten speichern','data-vocab-save="'+esc(v.id)+'"')+trashButton('data-vocab-delete="'+esc(v.id)+'"')+'</div></article>').join('')||'<p class="empty">Noch keine Vokabelsammlungen. Erstelle oben deine erste Sammlung.</p>')+'</div>';
app.querySelectorAll('[data-home-mode]').forEach(b=>b.onclick=()=>{homeMode=b.dataset.homeMode;home()});app.querySelector('#newVocab').onsubmit=e=>{e.preventDefault();const name=app.querySelector('#vocabName').value.trim();if(!name)return;const v={id:id(),name,words:[]};vocabularyLists.push(v);saveVocab();openVocab(v.id)};app.querySelectorAll('[data-vocab-open]').forEach(b=>b.onclick=()=>openVocab(b.dataset.vocabOpen));app.querySelectorAll('[data-vocab-save]').forEach(b=>b.onclick=()=>{const v=vocabularyLists.find(x=>x.id===b.dataset.vocabSave);if(v)downloadJSON({type:'vocabulary-collection',name:v.name,words:v.words},safeFileName(v.name)+'.json')});app.querySelectorAll('[data-vocab-delete]').forEach(b=>b.onclick=()=>{const v=vocabularyLists.find(x=>x.id===b.dataset.vocabDelete);if(v&&confirm('Vokabelsammlung „'+v.name+'“ löschen?')){vocabularyLists=vocabularyLists.filter(x=>x.id!==v.id);saveVocab();vocabularyHome()}})}
function openVocab(id){activeVocabId=id;vocabTab='words';vocabStudy=null;vocabQuiz=null;document.getElementById('homeBtn').hidden=false;document.getElementById('homeBtn').textContent='Alle Vokabelsammlungen';renderVocab()}

const old=topicEditMode&&editingCardIndex!==null?t.cards[editingCardIndex]:null;
const editor=topicEditMode?'<details class="panel card-editor" '+(old||topicEditMode?'open':'')+'><summary>'+(old?'Karte bearbeiten':'Neue Karte hinzufügen')+'</summary><form id="cardForm"><label class="field">Vorderseite: Frage oder Stichwort<input id="front" maxlength="180" placeholder="Zum Beispiel: Was ist Photosynthese?" required></label><label class="image-field">Bild zur Vorderseite (optional)<input id="frontImage" type="file" accept="image/*"></label>'+(old&&old.frontImage?'<label><input id="clearFrontImage" type="checkbox"> Bild auf der Vorderseite entfernen</label><div>'+iconTag(old.frontIcon,old.front||'Bild auf der Kartenvorderseite',200)+imageTag(old.frontImage,'Bild auf der Kartenvorderseite')+'</div>':'')+'<label class="field">Rückseite: Antwort<textarea id="back" rows="3" maxlength="1000" placeholder="Schreibe die Antwort …" required></textarea></label><label class="image-field">Bild zur Rückseite (optional)<input id="backImage" type="file" accept="image/*"></label>'+(old&&old.backImage?'<label><input id="clearBackImage" type="checkbox"> Bild auf der Rückseite entfernen</label><div>'+imageTag(old.backImage,'Bild auf der Kartenrückseite')+'</div>':'')+'<div class="row"><button class="btn primary">'+(old?'Änderungen speichern':'Karte hinzufügen')+'</button>'+(old?'<button class="btn" type="button" id="cancelCardEdit">Abbrechen</button>':'')+'</div></form></details>':'';
c.innerHTML=editor+'<h2>Deine Karten ('+t.cards.length+')</h2>'+(t.cards.length?'<div class="panel flash"><div class="muted">Karte '+(cardIndex+1)+' von '+t.cards.length+'</div><div class="side">'+esc(showAnswer?t.cards[cardIndex].back:t.cards[cardIndex].front)+(!showAnswer?iconTag(t.cards[cardIndex].frontIcon,t.cards[cardIndex].front,200):'')+imageTag(showAnswer?t.cards[cardIndex].backImage:t.cards[cardIndex].frontImage,showAnswer?'Bild zur Antwort':'Bild zur Frage')+'</div><div class="row" style="justify-content:center">'+btn(showAnswer?'Frage zeigen':'Antwort zeigen','id="flipCard" style="background:#dceeff;border-color:#8bbde7;color:#183a59"')+btn('← Zurück','id="prevCard"')+btn('Weiter →','id="nextCard"')+'</div>'+(topicEditMode?'<div class="row card-actions" style="justify-content:center">'+btn('Karte ändern','id="editCard"')+trashButton('id="deleteCard"')+'</div>':'')+'</div>':'<p class="empty">In diesem Thema gibt es noch keine Karten.</p>');
if(old){c.querySelector('#front').value=old.front||'';c.querySelector('#back').value=old.back||'';c.querySelector('#cancelCardEdit').onclick=()=>{editingCardIndex=null;render()}}
if(topicEditMode)c.querySelector('#cardForm').onsubmit=async e=>{e.preventDefault();const front=c.querySelector('#front').value.trim(),back=c.querySelector('#back').value.trim(),frontFile=c.querySelector('#frontImage').files[0],backFile=c.querySelector('#backImage').files[0];let frontImage=frontFile?await readImage(frontFile):(old?old.frontImage||'':''),backImage=backFile?await readImage(backFile):(old?old.backImage||'':'');if(old&&c.querySelector('#clearFrontImage')&&c.querySelector('#clearFrontImage').checked)frontImage='';if(old&&c.querySelector('#clearBackImage')&&c.querySelector('#clearBackImage').checked)backImage='';const card={id:old?old.id:id(),front,back,frontImage,backImage,frontIcon:old?old.frontIcon||'':''};if(old)t.cards[editingCardIndex]=card;else{t.cards.push(card);cardIndex=t.cards.length-1}editingCardIndex=null;showAnswer=false;save();render()};
if(!t.cards.length)return;
c.querySelector('#flipCard').onclick=()=>{showAnswer=!showAnswer;render()};
c.querySelector('#prevCard').onclick=()=>{cardIndex=(cardIndex+t.cards.length-1)%t.cards.length;showAnswer=false;render()};
c.querySelector('#nextCard').onclick=()=>{cardIndex=(cardIndex+1)%t.cards.length;showAnswer=false;render()};
if(topicEditMode){c.querySelector('#editCard').onclick=()=>{editingCardIndex=cardIndex;render()};c.querySelector('#deleteCard').onclick=()=>{if(confirm('Diese Karte löschen?')){t.cards.splice(cardIndex,1);cardIndex=Math.max(0,cardIndex-1);if(editingCardIndex===cardIndex)editingCardIndex=null;save();render()}}}
}
function startQuiz(source){const t=topic();if(!t)return;const queue=(source||t.cards.map((_,i)=>i)).slice().sort(()=>Math.random()-.5);quiz={queue,pos:0,known:new Set(),missed:new Set(),revealed:false}}
function quizStats(){const total=quiz.queue.length,known=quiz.known.size,missed=quiz.missed.size,open=Math.max(0,total-known-missed),percent=total?Math.round(known/total*100):0,k=total?known/total*100:0,m=total?missed/total*100:0;return '<section class="quiz-stats" aria-label="Lernstatistik"><div class="pie" role="img" aria-label="Tortendiagramm: '+known+' gewusst, '+missed+' noch zu üben, '+open+' offen" style="--k:'+k+'%;--m:'+m+'%"></div><div class="stats-text"><strong>'+known+' von '+total+' Karten gewusst · '+percent+' %</strong><div class="stats-legend">'+missed+' noch zu üben · '+open+' offen</div></div></section>'}
function renderQuiz(t,c){if(!quiz)startQuiz();if(!t.cards.length){c.innerHTML='<p class="empty">Erstelle zuerst Karteikarten in diesem Thema. Dann kannst du dich hier abfragen.</p>';return}if(!quiz||quiz.pos>=quiz.queue.length){const total=quiz?quiz.queue.length:0,known=quiz?quiz.known.size:0,missed=quiz?Array.from(quiz.missed):[];c.innerHTML=quizStats()+'<div class="quizbox center"><h2>Quiz beendet!</h2>'+(known===total&&total?'<div class="award" role="img" aria-label="Goldener Pokal als Auszeichnung"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M25 18h50v27c0 18-11 29-25 29S25 63 25 45V18Z" fill="#ffd447" stroke="#9b6813" stroke-width="4"/><path d="M25 27H12v12c0 13 8 20 21 20M75 27h13v12c0 13-8 20-21 20" fill="none" stroke="#d99b1d" stroke-width="8" stroke-linecap="round"/><path d="M50 74v12M35 89h30" stroke="#9b6813" stroke-width="7" stroke-linecap="round"/><path d="m50 28 4 9 10 1-7 7 2 10-9-5-9 5 2-10-7-7 10-1 4-9Z" fill="#fff6c9"/></svg></div><p class="superbrain">Bravo!-Toll gemacht Du bist ein Superbrain!!!!</p>':'<p>Du hattest '+known+' von '+total+' Karten gewusst. '+missed.length+' Karte'+(missed.length===1?'':'n')+' kannst du noch üben.</p>')+'<div class="row" style="justify-content:center"><button class="btn primary" id="restartQuiz">Alle Karten nochmal</button>'+(missed.length?'<button class="btn" id="retryMissed">Nicht gewusste Karten üben</button>':'')+'</div></div>';c.querySelector('#restartQuiz').onclick=()=>{startQuiz();render()};const retry=c.querySelector('#retryMissed');if(retry)retry.onclick=()=>{startQuiz(missed);render()};return}const current=quiz.queue[quiz.pos],card=t.cards[current];c.innerHTML=quizStats()+'<div class="quizbox"><div class="row spread"><b>Karte '+(quiz.pos+1)+' von '+quiz.queue.length+'</b></div><div class="side">'+esc(quiz.revealed?card.back:card.front)+(!quiz.revealed?iconTag(card.frontIcon,card.front,200):'')+imageTag(quiz.revealed?card.backImage:card.frontImage,quiz.revealed?'Bild zur Antwort':'Bild zur Frage')+'</div>'+(quiz.revealed?'<div class="row"><button class="btn danger" id="again">Noch nicht gewusst</button><button class="btn primary" id="known">Gewusst</button></div>':'<button class="btn primary" id="reveal">Antwort zeigen</button>')+'</div>';if(!quiz.revealed)c.querySelector('#reveal').onclick=()=>{quiz.revealed=true;render()};else{c.querySelector('#again').onclick=()=>{quiz.missed.add(current);quiz.known.delete(current);quiz.pos++;quiz.revealed=false;render()};c.querySelector('#known').onclick=()=>{quiz.known.add(current);quiz.missed.delete(current);quiz.pos++;quiz.revealed=false;render()}}}
function downloadJSON(data,filename){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.href=u;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function safeFileName(x){return String(x||'Thema').replace(/[<>:"/\\|?*]/g,'_').trim()||'Thema'}function validTopic(t){return t&&typeof t.name==='string'&&Array.isArray(t.notes)&&Array.isArray(t.cards)}function validVocab(v){return v&&typeof v.name==='string'&&Array.isArray(v.words)&&v.words.every(w=>Array.isArray(w)&&typeof w[0]==='string'&&typeof w[1]==='string')}function readImage(file){return new Promise((resolve,reject)=>{if(!file){resolve(null);return}const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const image=new Image();image.onerror=reject;image.onload=()=>{const canvas=document.createElement('canvas'),scale=Math.min(1,600/Math.max(image.width,image.height));canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.8))};image.src=reader.result};reader.readAsDataURL(file)})}function iconTag(name,alt,size){const path=SOURCE_ICONS[name];return typeof path==='string'?'<svg class="content-image inline-illustration" role="img" aria-label="'+esc(alt)+'" viewBox="0 0 64 64" width="'+(size||200)+'" height="'+(size||200)+'" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">'+path+'</svg>':''}function imageTag(src,alt){return typeof src==='string'&&/^data:image\/(?:png|jpeg|webp|gif);base64,|^data:image\/svg\+xml;(?:charset=utf-8,|base64,)/i.test(src)?'<img class="content-image" src="'+src+'" alt="'+esc(alt)+'">':''}
document.getElementById('homeBtn').onclick=home;document.getElementById('titleEditBtn').onclick=()=>{const value=prompt('Titel der Lernseite:',appTitle);if(value&&value.trim()){appTitle=value.trim().slice(0,80);localStorage.setItem('robin-hsu-app-title-v1',appTitle);document.title=appTitle;document.getElementById('pageTitle').textContent=appTitle}};document.getElementById('backupOut').onclick=()=>downloadJSON({title:appTitle,topics:topics,vocabCollections:vocabularyLists},safeFileName(appTitle)+'.json');document.getElementById('backupIn').onclick=()=>document.getElementById('backupFile').click();document.getElementById('topicIn').onclick=()=>document.getElementById('topicFile').click();
document.getElementById('backupFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result),incoming=Array.isArray(x)?x:(x&&Array.isArray(x.topics)?x.topics:null);if(!incoming||incoming.some(t=>!validTopic(t)))throw Error();if(confirm('Sicherung laden? Die aktuell gespeicherten Themen werden dadurch ersetzt.')){topics=incoming;vocabularyLists=!Array.isArray(x)&&Array.isArray(x.vocabCollections)&&x.vocabCollections.every(validVocab)?x.vocabCollections:[];saveVocab();topics.forEach((t,i)=>{if(!t.color)t.color=COLORS[i%COLORS.length];if(!t.textColor)t.textColor='#1e2b2c';if(t.monster===undefined)t.monster=i%10;if(!t.image)t.image=art(t.monster)});save();home();const savedTitle=Array.isArray(x)?'':(x.title??x.appTitle??x.pageTitle);if(typeof savedTitle==='string'&&savedTitle.trim()){appTitle=savedTitle.trim().slice(0,80);localStorage.setItem('robin-hsu-app-title-v1',appTitle);document.title=appTitle;document.getElementById('pageTitle').textContent=appTitle}}}catch(_){alert('Diese Sicherungsdatei ist ungültig.')}};r.readAsText(f);e.target.value=''};
document.getElementById('topicFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result),t=x&&x.topic?x.topic:x;if(!validTopic(t))throw Error();const copy=JSON.parse(JSON.stringify(t));copy.id=id();homeMode='topics';copy.color=copy.color||COLORS[topics.length%COLORS.length];copy.textColor=copy.textColor||'#1e2b2c';if(copy.monster===undefined)copy.monster=topics.length%10;copy.image=copy.image||art(copy.monster);topics.push(copy);save();home()}catch(_){alert('Diese Themen-Datei ist ungültig. Bitte wähle eine Datei, die über „Daten speichern“ auf einer Themenseite erstellt wurde.')}};r.readAsText(f);e.target.value=''};
document.getElementById('vocabIn').onclick=()=>document.getElementById('vocabFile').click();document.getElementById('vocabFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result),v=x&&x.collection?x.collection:x;if(!validVocab(v))throw Error();const copy=JSON.parse(JSON.stringify(v));copy.id=id();vocabularyLists.push(copy);saveVocab();homeMode='vocab';home()}catch(_){alert('Diese Vokabeldatei ist ungültig. Bitte wähle eine Datei, die über „Daten speichern“ auf einer Vokabelseite erstellt wurde.')}};r.readAsText(f);e.target.value=''};
home();})();
</script></body></html>
